name = "r0"
description = "r0 specification rules"

[[tests]]
name = "move int into r0"
program = [
	"mov r0, 10",
	"wfi"
]
[tests.expect.registers]
r0 = 0

[[tests]]
name = "addr into r0"
program = [
	"mov r1, 10",
	"add r0, r1, r0",
	"wfi"
]
[tests.expect.registers]
r0 = 0

[[tests]]
name = "addi into r0"
program = [
	"addi r0, r0, 100",
	"wfi"
]
[tests.expect.registers]
r0 = 0

[[tests]]
name = "sub into r0"
program = [
	"mov r1, 20",
	"sub r0, r0, r1",
	"wfi"
]
[tests.expect.registers]
r0 = 0

